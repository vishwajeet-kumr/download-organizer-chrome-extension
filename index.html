<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Organizer Pro — Every download, in its place. Automatically.</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #353545;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 580px;
      width: 100%;
      margin: auto;
      text-align: center;
    }

    .icon-wrapper {
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: #2a2a3a;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .icon-wrapper img {
      width: 48px;
      height: 48px;
      display: block;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    p.tagline {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .buttons-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #6366f1;
      color: #ffffff;
      border: 1px solid #6366f1;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      background-color: #4f46e5;
      border-color: #4f46e5;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #2a2a3a;
      color: #ffffff;
      border: 1px solid #475569;
    }

    .btn-secondary:hover {
      background-color: #3b3b4f;
      border-color: #64748b;
      transform: translateY(-1px);
    }

    .features-card {
      background: #2a2a3a;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #3f3f54;
      text-align: left;
      margin-bottom: 32px;
    }

    .features-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .features-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 14px;
      color: #e2e8f0;
    }

    .features-list li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-icon {
      color: #22c55e;
      font-weight: bold;
    }

    footer {
      width: 100%;
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid #3f3f54;
      font-size: 13px;
      color: #94a3b8;
    }

    footer a {
      color: #94a3b8;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: #ffffff;
    }

    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      p.tagline { font-size: 16px; }
      .buttons-group { flex-direction: column; width: 100%; }
      .btn { width: 100%; }
      .features-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <img src="icons/icon48.png" alt="Download Organizer Pro Icon">
    </div>

    <h1>Download Organizer Pro</h1>
    <p class="tagline">Every download, in its place. Automatically.</p>

    <div class="buttons-group">
      <a href="#" class="btn btn-primary" id="btn-get-pro">Get Pro - $4.99</a>
      <a href="#" class="btn btn-secondary" id="btn-monthly">Monthly - $1.99/mo</a>
    </div>

    <div class="features-card">
      <div class="features-title">What you get with Pro</div>
      <ul class="features-list">
        <li><span class="check-icon">✓</span> All 6 file categories</li>
        <li><span class="check-icon">✓</span> Custom folder names</li>
        <li><span class="check-icon">✓</span> Date-based subfolders</li>
        <li><span class="check-icon">✓</span> Download statistics</li>
      </ul>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Download Organizer Pro. <a href="/privacy-policy.html">Privacy Policy</a></p>
  </footer>
</body>
</html>
